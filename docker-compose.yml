services:
  price-service:
    build: .
    container_name: price-service
    command: >
      uvicorn App.price_service:app
      --host 0.0.0.0
      --port 8001
    ports:
      - "8001:8001"
    environment:
      # Add any env you need (API keys, etc.)
      # e.g. YFINANCE_API_KEY: "..."
      PYTHONUNBUFFERED: "1"

  fundamentals-service:
    build: .
    container_name: fundamentals-service
    command: >
      uvicorn App.fundamentals_service_api:app
      --host 0.0.0.0
      --port 8002
    ports:
      - "8002:8002"
    environment:
      PYTHONUNBUFFERED: "1"

  analysis-service:
    build: .
    container_name: analysis-service
    command: >
      uvicorn App.main:app
      --host 0.0.0.0
      --port 8000
    ports:
      - "8000:8000"
    environment:
      PRICE_SERVICE_URL: "http://price-service:8001"
      FUND_SERVICE_URL: "http://fundamentals-service:8002"
      PYTHONUNBUFFERED: "1"
    depends_on:
      - price-service
      - fundamentals-service
